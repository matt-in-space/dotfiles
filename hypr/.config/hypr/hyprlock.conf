# hyprlock — Tokyo Night, matched to the rest of the rice.

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot          # blur the current screen
    blur_passes = 3
    blur_size = 8
    color = rgba(26, 27, 38, 1.0)   # #1a1b26 fallback
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = 10

    inner_color = rgba(26, 27, 38, 0.85)    # #1a1b26
    outer_color = rgba(122, 162, 247, 1.0)  # #7aa2f7 blue
    check_color = rgba(158, 206, 106, 1.0)  # #9ece6a green (verifying)
    fail_color  = rgba(247, 118, 142, 1.0)  # #f7768e red   (wrong pw)
    font_color  = rgba(192, 202, 245, 1.0)  # #c0caf5
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Enter password…</span>

    position = 0, -20
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(192, 202, 245, 1.0)   # #c0caf5
    font_size = 64
    font_family = Hack Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(169, 177, 214, 1.0)   # #a9b1d6
    font_size = 20
    font_family = Hack Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi $USER
    color = rgba(86, 95, 137, 1.0)     # #565f89
    font_size = 16
    font_family = Hack Nerd Font
    position = 0, -95
    halign = center
    valign = center
}
