# hypridle — relaxed desktop profile.
# Lock at 10m, screen off at 12m, no auto-suspend, no lid/sleep hooks.

general {
    lock_cmd = pidof hyprlock || hyprlock   # don't stack hyprlock instances
    # No before_sleep_cmd / after_sleep_cmd: suspend & lid hooks intentionally
    # omitted (desktop). Add them back here if this ever becomes a laptop.
}

# Optional "dim" stage. Only works with backlight-controllable displays
# (laptops). Desktop monitors typically have no brightnessctl device, so this
# is left commented. Uncomment if your monitors support it.
# listener {
#     timeout = 300                       # 5 min
#     on-timeout = brightnessctl -s set 10
#     on-resume  = brightnessctl -r
# }

listener {
    timeout = 600                           # 10 min — lock the session
    on-timeout = loginctl lock-session
}

listener {
    timeout = 720                           # 12 min — screen off (DPMS)
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
